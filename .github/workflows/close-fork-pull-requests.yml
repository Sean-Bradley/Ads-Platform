
name: Explain and close fork pull requests

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write
  issues: write

jobs:
  close-pull-request:
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Explain and close pull request
        uses: actions/github-script@v7
        with:
          script: |
            const message = "Hi, the https://github.com/Sean-Bradley/Ads-Platform repository is provided as a starting point for the course. Please merge changes into your own fork rather than submitting a pull request here. I apologise for not mentioning this more clearer in the videos. Regards, Sean";

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: message
            });

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              state: "closed"
            });
